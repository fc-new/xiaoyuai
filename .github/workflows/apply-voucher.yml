    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/voucher-redemption-flow
          fetch-depth: 0
      - name: Restore and apply validated patch
        run: |
          python3 - <<'PY'
          import base64, gzip, os
          open('/tmp/voucher.patch', 'wb').write(gzip.decompress(base64.b64decode(os.environ['PATCH_B64'])))
          PY
          git apply --check /tmp/voucher.patch
          git apply --index /tmp/voucher.patch
          git config user.name f
          git config user.email cheyfuc2@gmail.com
          git commit -m "Add voucher issuance and fulfillment workflow"
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm ci --include=dev --no-audit --no-fund
      - run: npm run build
      - name: SQLite integration tests
        run: npm test
      - name: PostgreSQL integration tests
        run: npm test
        env:
          TEST_DATABASE_URL: postgresql://xiaoyuai_test:isolated-ci-password@127.0.0.1:5432/xiaoyuai_test
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Desktop and mobile browser flows
        run: npm run test:e2e
      - name: Push tested branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: git push origin HEAD:codex/voucher-redemption-flow
      - name: Create pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > /tmp/pr-body.md <<'EOF'
          ## Result

          Adds voucher purchase, automatic issuance, redemption, manual fulfillment, progress tracking, refund reconciliation and legacy-order compatibility.

          ## Validation

          - Production build
          - SQLite and PostgreSQL integration suites
          - Desktop and mobile voucher end-to-end flows

          ## Remaining configuration

          Configure `VOUCHER_SECRET` before enabling new purchases. Real payment providers still need merchant credentials and live reconciliation. Automatic subscription fulfillment stays disabled until an authorized provider with verifiable results is configured.
          EOF
          gh pr create --base main --head codex/voucher-redemption-flow --title "Add XiaoyuAI voucher issuance and fulfillment workflow" --body-file /tmp/pr-body.md || gh pr view codex/voucher-redemption-flow --json url --jq .url
