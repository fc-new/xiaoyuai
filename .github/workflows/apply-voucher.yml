name: Apply voucher delivery
on:
  push:
    branches: [codex/voucher-redemption-flow]
    paths: [.github/workflows/apply-voucher.yml]
permissions:
  contents: write
  pull-requests: write
jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 20
