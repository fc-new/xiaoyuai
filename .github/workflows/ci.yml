name: Application checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: xiaoyuai_test
          POSTGRES_PASSWORD: isolated-ci-password
          POSTGRES_DB: xiaoyuai_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U xiaoyuai_test -d xiaoyuai_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm ci --include=dev --no-audit --no-fund
      - run: npm run build
      - name: SQLite integration tests
        run: npm test
      - name: PostgreSQL integration tests
        run: npm test
        env:
          TEST_DATABASE_URL: postgresql://xiaoyuai_test:isolated-ci-password@127.0.0.1:5432/xiaoyuai_test
