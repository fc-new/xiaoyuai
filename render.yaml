services:
  - type: web
    name: xiaoyuai
    runtime: node
    plan: free
    region: singapore
    branch: main
    buildCommand: npm ci --include=dev --no-audit --no-fund && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24.19.0"
      - key: NODE_ENV
        value: production
      - key: PAYMENT_MODE
        value: demo
      - key: REQUIRE_DATABASE_URL
        value: "1"
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: VOUCHER_SECRET
        sync: false
